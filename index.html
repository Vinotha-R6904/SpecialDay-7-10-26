<script>

function showPage(n) {
  document.querySelectorAll(".page").forEach(function(page) {
    page.classList.remove("active");
  });

  var page = document.getElementById("page" + n);

  if (page) {
    page.classList.add("active");
    window.scrollTo(0, 0);
  }
}


function reveal() {
  var answerBox = document.getElementById("answerBox");
  var finalText = document.getElementById("finalText");

  answerBox.style.display = "block";

  setTimeout(function() {

    finalText.innerHTML = `
      <p>Okay... I know the answer! 😂❤️</p>

      <p>
        Actually... you're <b>ALL OF THEM!</b> 🥹❤️
      </p>

      <p>
        My Love ❤️<br>
        My Fighting Partner 😤❤️<br>
        My Paithiyam 🤪❤️
      </p>

      <h2>YOU ARE MY EVERYTHING ❤️</h2>
    `;

  }, 1500);
}


document.addEventListener("DOMContentLoaded", function() {

  document
    .getElementById("openSurprise")
    .addEventListener("click", function() {
      showPage(2);
    });


  document
    .getElementById("goBack")
    .addEventListener("click", function() {
      showPage(1);
    });


  document
    .getElementById("answerButton")
    .addEventListener("click", reveal);

});

</script>
