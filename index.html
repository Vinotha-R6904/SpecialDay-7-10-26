<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Oii Mama ❤️</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;

            font-family: Arial, sans-serif;

            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            color: white;
        }

        .box {
            padding: 40px 25px;
        }

        .heart {
            font-size: 70px;
        }

        h1 {
            font-size: 50px;
            margin: 15px 0;
        }

        p {
            font-size: 20px;
        }

        button {
            margin-top: 25px;
            padding: 15px 30px;

            border: none;
            border-radius: 30px;

            background-color: white;
            color: #e84368;

            font-size: 18px;
            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            transform: scale(1.05);
        }
    </style>
</head>

<body>

    <div class="box">

        <div class="heart">❤️</div>

        <h1>Oii Mama...</h1>

        <p>I made something special for you. 🥹❤️</p>

        <p>🎁 Are you ready?</p>

        <button onclick="openSurprise()">
            OPEN MY SURPRISE ❤️
        </button>

    </div>

    <script>
        function openSurprise() {
            alert("Wait Mama... ❤️ The surprise is just beginning! 😍");
        }
    </script>

</body>
</html>
